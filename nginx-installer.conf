# Included by the existing kemeradns.ru virtual host.
location = /3xui-installer {
    return 301 /3xui-installer/;
}

location = /3xui-installer/COMMANDS-3XUI-RU.txt {
    alias /var/www/3xui-installer/COMMANDS-3XUI-RU.txt;
    default_type text/plain;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location = /3xui-installer/COMMANDS-3XUI-RU.html {
    alias /var/www/3xui-installer/COMMANDS-3XUI-RU.html;
    default_type text/html;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location ^~ /3xui-installer/ {
    alias /var/www/3xui-installer/;
    autoindex off;
    default_type application/octet-stream;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
